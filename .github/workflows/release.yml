name: Release Nuget Package

on:
  push:
    branches: [ master ]

jobs:
  release:
   if: "contains(toJSON(github.event.commits.*.message), '[Release]')"
   runs-on: ubuntu-latest
   permissions:
     contents: read
     id-token: write

   steps:
   - uses: actions/checkout@v3
   - name: Setup .NET
     uses: actions/setup-dotnet@v2
     with:
       dotnet-version: 8.0.x
   - name: Restore dependencies
     run: dotnet restore
   - name: Build TwitchLib.Communication
     run: dotnet build -c Release --no-restore
   - name: Pack TwitchLib.Api
     run: dotnet pack TwitchLib.Communication.sln -v normal -c Release -o nugets --no-build
   - name: NuGet login
     uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
     id: login
     with:
       user: ${{ secrets.NUGET_USER }}
   - name: Push to Nuget
     run: dotnet nuget push "./nugets/*.nupkg" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json
   - name: Send Discord Notification
     uses: sarisia/actions-status-discord@v1
     if: always()
     with:
       webhook: ${{ secrets.DISCORD_WEBHOOK }}
       title: "Release Nuget Package"
       username: "TwitchLib Deploy"
